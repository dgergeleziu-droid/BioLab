name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -project BioLab.xcodeproj \
            -scheme BioLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BioLab.app Payload/
          zip -r BioLab.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BioLab-ipa
          path: BioLab.ipa
